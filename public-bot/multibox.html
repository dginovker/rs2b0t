<!DOCTYPE html>
<html>
<head>
    <title>rs2b0t — MultiBox</title>
    <meta charset="utf-8">
    <style>
        body { margin: 0; background: #000; color: #ddd; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; overflow: hidden; }

        /* app = a big ACTIVE pane on the left + a fixed-width rail of live thumbnails on the right */
        #mbx-app { display: flex; height: 100vh; }
        #mbx-main { flex: 1 1 auto; min-width: 0; position: relative; background: #0a0a0a; }
        #mbx-empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; color: #666; }
        #mbx-main.has-bots #mbx-empty { display: none; }
        #mbx-empty strong { color: #5be05b; font-size: 16px; }
        /* RAIL_W below must match RAIL_W in DomSlotOps.ts (focused-slot geometry depends on it) */
        #mbx-rail { flex: 0 0 264px; width: 264px; box-sizing: border-box; height: 100vh; overflow-y: auto; overflow-x: hidden; padding: 12px; background: #111; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }

        /* a rail tile: name + status dot over a live game frame cropped to the game viewport */
        .mbx-slot { width: 236px; flex: 0 0 auto; border: 1px solid #2c2c2c; border-radius: 4px; background: #000; cursor: grab; overflow: hidden; user-select: none; }
        .mbx-slot:hover { border-color: #04A800; }
        .mbx-slot.is-focused { border-color: #04A800; }
        .mbx-slot.is-dragging { cursor: grabbing; opacity: 0.4; }
        .mbx-slot.mbx-drop-before { box-shadow: 0 -5px 0 #04A800; }
        .mbx-slot.mbx-drop-after { box-shadow: 0 5px 0 #04A800; }
        .mbx-cap { display: flex; align-items: center; gap: 6px; padding: 3px 7px; background: #1a1a1a; }
        .mbx-slot.is-focused .mbx-cap { background: #07330a; color: #5be05b; }
        .mbx-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: 0 0 auto; }
        .mbx-dot.is-online { background: #04A800; }
        .mbx-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mbx-close { margin-left: auto; flex: 0 0 auto; background: none; border: 0; color: #666; cursor: pointer; font: inherit; padding: 0 2px; }
        .mbx-close:hover { color: #e05b5b; }
        /* TILE_W/TILE_H below must match TILE_W/TILE_H in DomSlotOps.ts (crop math depends on it) */
        .mbx-body { position: relative; width: 236px; height: 155px; background: #000; }
        .mbx-clip { position: absolute; inset: 0; overflow: hidden; background: #000; }
        .mbx-scaler { width: 1100px; height: 620px; transform-origin: top left; }
        .mbx-frame { width: 1100px; height: 620px; border: 0; display: block; }
        /* shown only for the focused bot, whose own iframe is busy filling the main pane */
        .mbx-mirror { position: absolute; inset: 0; display: none; }
        /* the iframe swallows clicks, so this overlay is what makes a tile clickable */
        .mbx-hit { position: absolute; inset: 0; z-index: 3; }

        /* Focused: only the clip (holding the live iframe) is lifted over the main pane.
           It is never reparented, so the game session survives the switch — and the tile
           keeps its place in the rail, mirroring that canvas. */
        .mbx-slot.is-focused .mbx-clip { position: fixed; top: 0; left: 0; bottom: 0; right: 264px; width: auto; height: auto; z-index: 40; }
        .mbx-slot.is-focused .mbx-mirror { display: block; }

        .mbx-addtile { display: flex; align-items: center; justify-content: center; height: 52px; flex: 0 0 auto; font-size: 14px; color: #666; border: 1px dashed #444; border-radius: 4px; cursor: pointer; }
        .mbx-addtile:hover { color: #04A800; border-color: #04A800; }
        .mbx-mode { width: 236px; flex: 0 0 auto; padding: 6px 8px; border: 1px solid #355d39; border-radius: 4px; background: #102313; color: #72df7d; cursor: pointer; font: inherit; }
        .mbx-mode:hover:not(:disabled) { border-color: #04A800; background: #17351b; }
        .mbx-mode:disabled { opacity: .55; cursor: default; }
        .mbx-resources { width: 236px; box-sizing: border-box; flex: 0 0 auto; padding: 7px 8px; border: 1px solid #2c2c2c; border-radius: 4px; background: #0a0a0a; display: flex; flex-direction: column; gap: 4px; }
        .mbx-resource-bots { padding-bottom: 4px; border-bottom: 1px solid #222; color: #5be05b; }
        .mbx-resource-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 3px 8px; }
        /* an author display rule beats the UA's [hidden]{display:none}, so the
           hidden host rows need this or they stay on screen */
        .mbx-resource-row[hidden] { display: none; }
        .mbx-resource-label { color: #666; }
        .mbx-resource-value { color: #bbb; text-align: right; white-space: nowrap; }
        .mbx-resource-value.mbx-resource-detail { flex: 1 0 100%; color: #d9a45b; text-align: left; white-space: normal; overflow-wrap: anywhere; line-height: 1.35; }

        #mbx-drawer { position: fixed; top: 12px; right: 264px; z-index: 50; width: 16px; height: 56px; display: flex; align-items: center; justify-content: center; background: #111; border: 1px solid #333; border-right: 0; border-radius: 4px 0 0 4px; color: #666; cursor: pointer; }
        #mbx-drawer:hover { color: #04A800; border-color: #04A800; }
        /* collapse by width, NOT display:none — the focused slot's position:fixed clip
           is a rail descendant and display:none on the rail would blank it */
        #mbx-app.mbx-rail-hidden #mbx-rail { flex: 0 0 0px; width: 0; padding: 0; border-left: 0; overflow: hidden; }
        #mbx-app.mbx-rail-hidden #mbx-drawer { right: 0; }
        #mbx-app.mbx-rail-hidden .mbx-slot.is-focused .mbx-clip { right: 0; }

        .mbx-chooser-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
        .mbx-chooser-overlay[hidden] { display: none; }
        .mbx-chooser { width: 300px; max-height: 70vh; overflow-y: auto; background: #111; border: 1px solid #333; border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .mbx-chooser-title { color: #5be05b; }
        .mbx-chooser-list { display: flex; flex-direction: column; gap: 4px; }
        .mbx-chooser-empty { color: #666; }
        #mbx-load-all { background: #07330a; border: 1px solid #04A800; color: #5be05b; padding: 5px 7px; border-radius: 3px; cursor: pointer; font: inherit; }
        .mbx-vault-error { color: #e05b5b; min-height: 14px; }
        .mbx-vault-reset { color: #666; cursor: pointer; text-decoration: underline; }
        .mbx-vault-reset:hover { color: #e05b5b; }
        .mbx-profile-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; border: 1px solid #2c2c2c; border-radius: 4px; cursor: pointer; }
        .mbx-profile-row:hover { border-color: #04A800; }
        .mbx-profile-del { background: none; border: 0; color: #666; cursor: pointer; font: inherit; }
        .mbx-profile-del:hover { color: #e05b5b; }
        .mbx-chooser-form { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #2c2c2c; padding-top: 8px; }
        .mbx-chooser-form input { background: #000; border: 1px solid #333; color: #ddd; padding: 5px 7px; border-radius: 3px; font: inherit; }
        .mbx-chooser-form button { background: #07330a; border: 1px solid #04A800; color: #5be05b; padding: 5px 7px; border-radius: 3px; cursor: pointer; font: inherit; }

        /* Headless mode keeps all clients in one page and replaces live game
           thumbnails with status cards. The focused card exposes the complete
           script/settings/log control surface, but intentionally no renderer. */
        .mbx-headless-thumb { box-sizing: border-box; padding: 16px 12px 10px; background: radial-gradient(circle at top right, #15351a, #090d09 62%); }
        .mbx-headless-badge { color: #72df7d; font-size: 10px; letter-spacing: .14em; margin-bottom: 18px; }
        .mbx-headless-state { color: #ddd; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mbx-headless-script { color: #7d8b7e; margin-top: 8px; line-height: 1.4; }
        .mbx-headless-pane { position: absolute; inset: 0; overflow: auto; box-sizing: border-box; padding: 28px clamp(24px, 5vw, 72px); background: #0a0e0a; }
        .mbx-headless-pane[hidden] { display: none; }
        .mbx-headless-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; border-bottom: 1px solid #243026; padding-bottom: 12px; }
        .mbx-headless-title { margin: 0; color: #72df7d; font-size: 24px; }
        .mbx-headless-mode { color: #667668; }
        .mbx-headless-status { margin: 14px 0; color: #a5b7a7; }
        .mbx-headless-status.is-error { color: #ff7b7b; }
        .mbx-headless-controls { max-width: 900px; border: 1px solid #243026; border-radius: 6px; padding: 18px; background: #101610; }
        .mbx-headless-label { display: grid; gap: 7px; color: #809084; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
        .mbx-headless-select, .mbx-headless-input { box-sizing: border-box; width: 100%; background: #080b08; color: #ddd; border: 1px solid #344137; border-radius: 4px; padding: 7px 9px; font: 12px ui-monospace, monospace; }
        .mbx-headless-description { margin: 12px 0 16px; color: #829085; line-height: 1.5; }
        .mbx-headless-settings { display: grid; gap: 8px; max-height: 42vh; overflow: auto; padding-right: 5px; }
        .mbx-headless-setting { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr); gap: 18px; align-items: center; padding: 8px 0; border-top: 1px solid #202a22; }
        .mbx-headless-setting-text { display: grid; gap: 3px; }
        .mbx-headless-setting-label { color: #c5cec6; }
        .mbx-headless-setting-help { color: #68736a; font-size: 10px; line-height: 1.4; }
        .mbx-headless-setting input[type=checkbox] { justify-self: end; width: 18px; height: 18px; accent-color: #04A800; }
        .mbx-headless-empty { color: #68736a; padding: 8px 0; }
        .mbx-headless-buttons { display: flex; gap: 8px; margin-top: 16px; }
        .mbx-headless-button { min-width: 100px; border: 1px solid #344137; border-radius: 4px; padding: 7px 14px; background: #171e18; color: #d5ddd6; cursor: pointer; font: inherit; }
        .mbx-headless-button:hover:not(:disabled) { border-color: #04A800; }
        .mbx-headless-button:disabled { opacity: .4; cursor: default; }
        .mbx-headless-start { color: #72df7d; }
        .mbx-headless-subtitle { color: #819083; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin: 22px 0 8px; }
        .mbx-headless-log { max-width: 900px; height: 220px; overflow: auto; box-sizing: border-box; padding: 10px; border: 1px solid #202a22; border-radius: 5px; background: #050805; color: #aab4ab; line-height: 1.5; }
        .mbx-headless-log-line.is-warn { color: #e0d75b; }
        .mbx-headless-log-line.is-error { color: #ff7b7b; }
        @media (max-width: 760px) { .mbx-headless-setting { grid-template-columns: 1fr; gap: 7px; } }
    </style>
</head>
<body>
    <div id="mbx-app">
        <div id="mbx-main"><div id="mbx-empty"><strong>MultiBox</strong><span>Add a profile, or choose headless mode for large fleets.</span></div></div>
        <div id="mbx-rail">
            <button id="mbx-mode" class="mbx-mode" type="button">Mode: Visual</button>
            <div id="mbx-add" class="mbx-addtile">+ add bot</div>
            <div id="mbx-resources" class="mbx-resources">
                <div id="mbx-resource-bots" class="mbx-resource-bots">0 bots</div>
                <div id="mbx-resource-cpu-row" class="mbx-resource-row" title="CPU used by every process/thread in the dedicated bot browser"><span class="mbx-resource-label">CPU</span><span id="mbx-resource-cpu" class="mbx-resource-value">measuring…</span></div>
                <div id="mbx-resource-memory-row" class="mbx-resource-row" title="Current memory charged to the dedicated bot browser"><span class="mbx-resource-label">RAM</span><span id="mbx-resource-memory" class="mbx-resource-value">measuring…</span></div>
                <div class="mbx-resource-row" title="Bot game and cache WebSocket payload measured inside each client"><span class="mbx-resource-label">Traffic</span><span id="mbx-resource-traffic" class="mbx-resource-value">measuring…</span></div>
            </div>
        </div>
        <div id="mbx-drawer" title="show/hide bots">▶</div>
    </div>
    <script type="module" src="./bot/multibox.js"></script>
</body>
</html>
